services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: loopress
      MYSQL_DATABASE: wordpress
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12
      # A fresh mysql:8.0 data dir occasionally takes longer than 60s (12 * 5s) to
      # initialize on a loaded CI runner. Failures during start_period don't count
      # against retries, so a slow cold start no longer flips this to unhealthy and
      # fails 'docker compose up' (wordpress depends_on: condition: service_healthy).
      start_period: 30s

  wordpress:
    image: wordpress:${LOOPRESS_WP_VERSION:-latest}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: loopress
    ports:
      - "${LOOPRESS_WP_PORT:-8080}:80"
    # Lets start-wordpress.sh block on `docker compose up --wait`. A fresh install answers 302
    # (to wp-admin/install.php), which `curl -f` counts as up since it doesn't follow redirects.
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "http://localhost/"]
      interval: 3s
      timeout: 5s
      retries: 30
