# Loopress GitLab CI Template
# Hosted by Loopress — do not copy, reference via remote include

spec:
  inputs:
    version:
      default: "main"
      description: "Git ref of loopress/setup-ci to pull docker/compose.yml and scripts/ from"
---

.loopress-bootstrap:
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    LOOPRESS_WP_VERSION: "latest"
    LOOPRESS_WP_PORT: "8080"
    LOOPRESS_WP_HOST: "docker"
    LOOPRESS_CONFIG_TEMPLATE: "/tmp/loopress-config.json"
  before_script:
    - apk add --no-cache bash curl jq gettext nodejs npm
    - |
      BASE_URL="https://raw.githubusercontent.com/loopress/setup-ci/$[[ inputs.version ]]"
      curl -fsSL "$BASE_URL/docker/compose.yml" -o /tmp/loopress-compose.yml
      curl -fsSL "$BASE_URL/scripts/start-wordpress.sh" -o /tmp/loopress-start.sh
      curl -fsSL "$BASE_URL/scripts/setup-wordpress.sh" -o /tmp/loopress-setup.sh
      curl -fsSL "$BASE_URL/scripts/restore-wordpress.sh" -o /tmp/loopress-restore.sh
      curl -fsSL "$BASE_URL/scripts/setup-loopress.sh" -o /tmp/loopress-cli.sh
      curl -fsSL "$BASE_URL/templates/loopress-config.json" -o "$LOOPRESS_CONFIG_TEMPLATE"
      chmod +x /tmp/loopress-start.sh /tmp/loopress-setup.sh /tmp/loopress-restore.sh /tmp/loopress-cli.sh
    - /tmp/loopress-start.sh
    - /tmp/loopress-setup.sh
    - /tmp/loopress-cli.sh

.loopress-test:
  extends: .loopress-bootstrap
  script:
    - loopress push
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

.loopress-deploy:
  image: node:20-alpine
  variables:
    LOOPRESS_SITE: "staging"
  before_script:
    - npm install -g @loopress/cli
  script:
    - loopress push --site $LOOPRESS_SITE
    - loopress diff --site $LOOPRESS_SITE
