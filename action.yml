name: "Loopress Setup"
description: "Bootstrap a WordPress instance and apply Loopress configuration"

branding:
  icon: "zap"
  color: "blue"

inputs:
  token:
    description: "Loopress cloud token, exported as LOOPRESS_TOKEN for later steps. Not needed for CI testing, only for deploying to real sites."
    required: false
  wp-version:
    description: "WordPress version"
    default: "latest"
  site-id:
    description: "Loopress site ID"
    default: "ci"
  port:
    description: "WordPress port on the runner"
    default: "8080"

outputs:
  wp-url:
    description: "WordPress URL"
    value: ${{ steps.info.outputs.wp-url }}

runs:
  using: "composite"
  steps:
    - name: Start WordPress stack
      shell: bash
      env:
        LOOPRESS_WP_VERSION: ${{ inputs.wp-version }}
        LOOPRESS_WP_PORT: ${{ inputs.port }}
        LOOPRESS_COMPOSE_FILE: ${{ github.action_path }}/docker/compose.yml
      run: bash $GITHUB_ACTION_PATH/scripts/start-wordpress.sh

    - name: Install WordPress
      shell: bash
      env:
        LOOPRESS_WP_PORT: ${{ inputs.port }}
        LOOPRESS_SITE_ID: ${{ inputs.site-id }}
        LOOPRESS_COMPOSE_FILE: ${{ github.action_path }}/docker/compose.yml
        GITHUB_TOKEN: ${{ github.token }}
      run: bash $GITHUB_ACTION_PATH/scripts/setup-wordpress.sh

    - name: Set outputs
      id: info
      shell: bash
      run: echo "wp-url=http://localhost:${{ inputs.port }}" >> $GITHUB_OUTPUT

    # The CLI reads LOOPRESS_TOKEN from the environment, and a composite step's own `env:` never
    # reaches the caller's later steps, so it's exported through GITHUB_ENV instead.
    - name: Export token
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: |
        if [ -n "$TOKEN" ]; then
          echo "LOOPRESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
        else
          echo "::warning::No Loopress token provided. CI testing is free and unlimited, but deploying to real sites requires a token: https://console.loopress.dev/tokens"
        fi

    - name: Install Loopress CLI
      shell: bash
      run: bash $GITHUB_ACTION_PATH/scripts/setup-loopress.sh
