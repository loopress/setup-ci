name: 🤖 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  config-template:
    name: Config template matches schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check loopress-config.json template against the global-config schema
        run: npm run check:config-template
